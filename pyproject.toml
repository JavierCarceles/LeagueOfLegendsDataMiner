[project]
name = "tempu-drafter"
version = "2.0.0"
description = "Analizador de drafts, matchups y estadísticas de League of Legends (OP.GG + Riot API)"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 140
cache-dir = ".cache/ruff"
target-version = "py310"
