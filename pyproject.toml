[project]
name = "tempu-drafter"
version = "2.0.0"
description = "Analizador de drafts, matchups y estadísticas de League of Legends (OP.GG + Riot API)"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
cache_dir = ".cache/pytest"

[tool.ruff]
line-length = 140
cache-dir = ".cache/ruff"
target-version = "py310"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declara las dependencias y los parámetros con llamadas en el valor por defecto: es su forma correcta.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path", "fastapi.Header"]
