    <script>
      let ultimosMatchupsCargados = [];

      const consoleList = document.getElementById("frontend-console");
      const consoleContainer = document.getElementById("console-container");

      function addConsoleLog(message, type = "info") {
        if (!consoleList || !consoleContainer) return;

        const li = document.createElement("li");

        // Usamos los colores hexadecimales exactos de Tailwind
        const colors = {
          success: "#4ade80", // Equivalente a text-green-400
          error: "#f87171", // Equivalente a text-red-400
          info: "#cbd5e1", // Equivalente a text-slate-300
          api: "#64748b", // Equivalente a text-slate-500
        };

      async function generarGuiaIA(rol, main, enemy, boton) {
        boton.disabled = true;

        boton.style.background = "#4b5563";

        try {
          const respuesta = await fetch("/api/generate-guide", {

            boton.innerText = "✨ Intentar de nuevo";
            boton.style.background = "#6a1b9a";

      function championKey(name) {
        const normalized = String(name || "")
          .trim()
          .toLowerCase();
        if (CHAMPION_KEYS[normalized]) return CHAMPION_KEYS[normalized];
        return normalized
          .replace(/[^a-z0-9]/g, "")
          .replace(/^./, (letter) => letter.toUpperCase());
      }

      function updateChampionPortrait(input) {
        const slot = input.closest(".relative");
        if (!slot) return;
        slot.classList.add("champ-slot");
        if (input.id.endsWith("-enemigo")) slot.classList.add("enemy-slot");

        let portrait = slot.querySelector(".champ-portrait");
        if (!portrait) {
          portrait = document.createElement("img");
          portrait.className = "champ-portrait";
          portrait.alt = "";
          portrait.addEventListener("error", () =>
            portrait.classList.remove("visible"),
          );
          slot.prepend(portrait);
        }

        const value = input.value.trim();
        if (!value) {
          portrait.removeAttribute("src");
          portrait.classList.remove("visible");
          return;
        }
        portrait.src = `https://ddragon.leagueoflegends.com/cdn/${DATA_DRAGON_VERSION}/img/champion/${championKey(value)}.png`;

      // ============================================
      // CARGAR CAMPEONES DESDE EL BACKEND
      // ============================================
      async function cargarCampeones() {
        const roles = ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"];

        for (const rol of roles) {
          try {
            const response = await fetch(`/api/campeones?rol=${rol}`);
            if (response.ok) {
              const data = await response.json();
              const datalist = document.getElementById(`lista-${rol}`);

              if (datalist && data.campeones) {
                datalist.innerHTML = ""; // Limpiar lista
                data.campeones.forEach((champ) => {

                  opt.value = champ;
                  datalist.appendChild(opt);

                  campeonesPorRol[rol].add(champ);
                });
              }
            }

            console.error(`[ERROR] Al cargar campeones para ${rol}:`, err);

      function renderizarSugerencias(data, container, rol, targetSide) {
        const sideStr = targetSide ? targetSide.toLowerCase() : "";
        const isAllied =
          sideStr.includes("aliado") ||
          sideStr.includes("ally") ||
          sideStr.includes("blue");

        console.group(`[LÓGICA RENDER] Procesando sugerencias para ${rol}`);
        console.log(
          `Lado detectado: "${targetSide}" -> ¿Es aliado?: ${isAllied}`,
        );

        console.log(`[DEBUG] Datos puros recibidos del backend:`, data);

        const todosMatchups = [
          ...(data.peores || []),
          ...(data.mejores || []),
          ...(data.mas_jugados || []),
        ]
          .map((m) => ({ name: m.campeon, w: m.wins, l: m.losses, ...m }))
          .filter(Boolean);

        console.log(
          `[DEBUG] Array combinado (antes de limpiar duplicados):`,
          todosMatchups,
        );

        const unicosMap = new Map();
        todosMatchups.forEach((m) => {
          const totalM = m.w + m.l;
          if (
            !unicosMap.has(m.name) ||
            totalM > unicosMap.get(m.name).w + unicosMap.get(m.name).l
          ) {
            unicosMap.set(m.name, m);
          }
        });
        const listaUnica = Array.from(unicosMap.values());

        console.log(`[DEBUG] Lista única resultante:`, listaUnica);

        if (listaUnica.length === 0) {
          container.innerHTML = `<div class="p-2 text-center text-xs text-gray-500">Sin datos registrados</div>`;
          container.classList.remove("hidden");
          console.groupEnd();
          return;
        }

        let filtrados = listaUnica.filter((m) => m.w + m.l >= 20);
        if (filtrados.length < 6) {
          const filtradosDiez = listaUnica.filter((m) => m.w + m.l >= 10);
          filtrados =
            filtradosDiez.length >= 6
              ? filtradosDiez
              : [...listaUnica]
                  .sort((a, b) => b.w + b.l - (a.w + a.l))
                  .slice(0, 10);
        }

        const conWinrate = filtrados.map((m) => {
          const total = m.w + m.l;
          return { ...m, total, wr: total > 0 ? (m.w / total) * 100 : 0 };
        });

        const mejores = [...conWinrate]
          .sort((a, b) => b.wr - a.wr || b.total - a.total)
          .slice(0, 3);
        const peores = [...conWinrate]
          .sort((a, b) => a.wr - b.wr || b.total - a.total)
          .slice(0, 3);

        // ==========================================
        // LÓGICA DE ESPEJO Y DEGRADADO (INLINE CSS)
        // ==========================================
        const titleLeft = isAllied ? "Mejores Matchups" : "Peores Matchups";
        const titleRight = isAllied ? "Peores Matchups" : "Mejores Matchups";

        const bgGradient = isAllied
          ? "linear-gradient(to right, rgba(20, 83, 45, 0.25), rgba(30, 41, 59, 1) 50%, rgba(127, 29, 29, 0.25))"
          : "linear-gradient(to right, rgba(127, 29, 29, 0.25), rgba(30, 41, 59, 1) 50%, rgba(20, 83, 45, 0.25))";

        let html = `
<div class="bg-gray-900 border-b border-gray-700 px-2 py-1.5 flex justify-between sug-header-title uppercase font-bold text-gray-400">

    <span class="sug-top-title text-[11px]">${titleRight}</span>
</div>
<div class="p-1.5 space-y-1.5" style="background: ${bgGradient};">`;

        const maxRows = Math.max(peores.length, mejores.length, 3);

        for (let i = 0; i < maxRows; i++) {
          const peor = peores[i] || null;
          const mejor = mejores[i] || null;

          if (!peor && !mejor) continue;

          const btnPeor = peor
            ? `<button type="button" data-suggestion="${encodeURIComponent(peor.name)}" class="flex-1 flex justify-between items-center bg-red-950/40 hover:bg-red-900/60 border border-red-800/80 rounded px-2 py-1.5 cursor-pointer transition-colors w-1/2 shadow-sm" title="${peor.name} (${peor.total} part.)">
      <span class="sug-item-name text-gray-200 truncate pr-1">${peor.name}</span>
      <span class="sug-item-stats text-red-400 whitespace-nowrap">${peor.w}-${peor.l}</span>
  </button>`
            : `<div class="flex-1 w-1/2"></div>`;

          const btnMejor = mejor
            ? `<button type="button" data-suggestion="${encodeURIComponent(mejor.name)}" class="flex-1 flex justify-between items-center bg-green-950/40 hover:bg-green-900/60 border border-green-800/80 rounded px-2 py-1.5 cursor-pointer transition-colors w-1/2 shadow-sm" title="${mejor.name} (${mejor.total} part.)">
      <span class="sug-item-name text-gray-200 truncate pr-1">${mejor.name}</span>
      <span class="sug-item-stats text-green-400 whitespace-nowrap">${mejor.w}-${mejor.l}</span>
  </button>`
            : `<div class="flex-1 w-1/2"></div>`;

          html += `<div class="flex gap-1.5 w-full">`;
          html += isAllied ? btnMejor + btnPeor : btnPeor + btnMejor;
          html += `</div>`;
        }
        html += `</div>`;

        const frecuentes = [...listaUnica]
          .sort((a, b) => b.w + b.l - (a.w + a.l))
          .slice(0, 3);

        console.log(
          `[DEBUG] Top 3 (Frecuentes) que se van a pintar:`,
          frecuentes,
        );

        if (frecuentes.length > 0) {
          html += `
<div class="bg-gray-900 border-t border-b border-gray-700 px-2 py-1.5 flex justify-center sug-top-title uppercase font-bold text-gray-400 mt-0.5">
    <span class="sug-top-title text-[11px]">Top 3 Enfrentamientos</span>
</div>
<div class="p-1.5 space-y-1.5 bg-slate-800">`;

          for (let i = 0; i < Math.min(3, frecuentes.length); i++) {
            const item = frecuentes[i];
            const total = item.w + item.l;
            const winrate = total > 0 ? Math.round((item.w / total) * 100) : 0;

            let colorClass = "text-blue-400";
            let bgClass =
              "bg-blue-950/20 hover:bg-blue-900/40 border-blue-800/50";

            if (winrate >= 55) {
              colorClass = "text-green-400";
              bgClass =
                "bg-green-950/20 hover:bg-green-900/40 border-green-800/50";
            } else if (winrate <= 45) {
              colorClass = "text-red-400";
              bgClass = "bg-red-950/20 hover:bg-red-900/40 border-red-800/50";
            }

            html += `
  <button type="button" data-suggestion="${encodeURIComponent(item.name)}" class="flex justify-between items-center ${bgClass} border rounded px-2 py-1.5 cursor-pointer transition-colors w-full shadow-sm" title="${item.name}">

          <span class="sug-top-stats ${colorClass} whitespace-nowrap">${item.w}-${item.l}</span>
      </div>
  </button>`;
          }
          html += `</div>`;
        }

        container.innerHTML = html;
        container.classList.remove("hidden");
        container.className =
          "mt-2 rounded-lg overflow-hidden shadow-lg border border-slate-700 bg-slate-900 text-left w-full relative block h-auto max-h-none";

        // 🔥 LÓGICA DE EVENTOS ACTUALIZADA 🔥
        container.onclick = (e) => {
          const btn = e.target.closest("[data-suggestion]");
          if (!btn) return;

          const nombreCampeon = decodeURIComponent(btn.dataset.suggestion);
          const targetSideLower = targetSide.toLowerCase();
          const targetInputId = `${rol.toLowerCase()}-${targetSideLower}`;
          const targetInput = document.getElementById(targetInputId);

          if (targetInput) {
            targetInput.value = nombreCampeon;

            if (typeof updateChampionPortrait === "function") {
              updateChampionPortrait(targetInput);
            }

            if (typeof analizarDraft === "function") {
              analizarDraft();

            container.classList.add("hidden");

            // 🔥 FIX: Llamamos a onInputChamp para forzar el ciclo de sugerencias
            // Esto simula que el usuario ha "escrito" el campeón y cargará el panel opuesto
            if (typeof onInputChamp === "function") {
              onInputChamp(rol, targetSideLower);

        console.groupEnd();

      async function onInputChamp(rol, side) {
        clearTimeout(inputTimeout);

        inputTimeout = setTimeout(async () => {
          analizarDraft();

          const inputId = `${rol.toLowerCase()}-${side}`;
          const input = document.getElementById(inputId);
          updateChampionPortrait(input);
          const valor = input.value.trim();

          const otherSide = side === "aliado" ? "enemigo" : "aliado";
          const sugContainerId = `sug-${rol.toLowerCase()}-${otherSide}`;
          const sugContainer = document.getElementById(sugContainerId);

          const listaRol = Array.from(campeonesPorRol[rol] || []);
          const campeonValido =
            listaRol.find((c) => c.toLowerCase() === valor.toLowerCase()) ||
            (valor.length >= 2 ? valor : null);

          if (campeonValido && valor.length >= 2) {
            await mostrarSugerencias(
              rol,
              campeonValido,
              side,
              sugContainer,
              otherSide,
            );
          } else {
            sugContainer.classList.add("hidden");
          }
        }, 400);

      async function mostrarSugerencias(
        rol,
        campeonSeleccionado,
        sideSeleccionado,
        containerBox,

      function describirErrorGuia(error) {
        const texto = String(error || "");
        if (/429|quota|cuota|resource_exhausted|token|limit/i.test(texto))
          return "Cuota agotada";
        return "Error de generación";
      }

      async function generarGuiasRol(rol, boton) {
        const matches = window.matchupsPorRol?.[rol] || [];
        const roleKey = rol.toLowerCase();
        const roleStatus = document.getElementById(`role-status-${roleKey}`);
        if (!matches.length || boton.disabled) return;

        boton.disabled = true;
        let completed = 0;
        let failed = 0;
        roleStatus.textContent = `Generando 0/${matches.length}`;

        for (let index = 0; index < matches.length; index++) {
          const match = matches[index];
          const row = document.getElementById(`matchup-${roleKey}-${index}`);
          const rowStatus = row?.querySelector(".matchup-row-status");
          if (rowStatus) rowStatus.textContent = "Generando...";

          try {
            const response = await fetch("/api/generate-guide", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                rol,
                champ_main: match.champ_main,
                champ_enemy: match.champ_enemy,
              }),
            });
            const result = await response.json();
            if (!response.ok || !result.success)
              throw new Error(result.error || "Error desconocido");
            completed++;
            if (rowStatus) {
              rowStatus.textContent = "Guía lista";
              rowStatus.className = "matchup-row-status ready";
            }
          } catch (error) {
            failed++;
            if (rowStatus) {
              rowStatus.textContent = describirErrorGuia(error.message);
              rowStatus.className = "matchup-row-status failed";
            }
          }
          roleStatus.textContent = `Generando ${completed + failed}/${matches.length}`;
          if (index < matches.length - 1)
            await new Promise((resolve) => setTimeout(resolve, 1000));
        }

        roleStatus.textContent = failed
          ? `${completed} listas · ${failed} fallidas`
          : `${completed} guías listas`;
        roleStatus.className = failed
          ? "role-generation-status warning"
          : "role-generation-status ready";
        boton.textContent = failed ? "Reintentar fallidas" : "Guías generadas";
        boton.disabled = false;
      }

            `/api/partidas?riot_id=${encodeURIComponent(riotId)}`,

      function toggleHistoryMatch(index) {
        const details = document.getElementById(`history-details-${index}`);
        const row = document.getElementById(`history-match-${index}`);

      function renderizarHistorial(container, partidas) {
        const wins = partidas.filter((partida) => partida.victoria).length;
        const losses = partidas.length - wins;
        const winrate = partidas.length
          ? Math.round((wins / partidas.length) * 100)
          : 0;
        const porElo = {};
        partidas.forEach((partida) => {
          const tier = partida.elo || "UNRANKED";
          if (!porElo[tier])
            porElo[tier] = {
              partidas: 0,
              wins: 0,
              division: partida.division || "",
            };
          porElo[tier].partidas++;
          if (partida.victoria) porElo[tier].wins++;
        });

        const eloSummary = Object.entries(porElo)
          .map(([tier, valores]) => {
            const eloWinrate = Math.round(
              (valores.wins / valores.partidas) * 100,
            );
            return `<div class="elo-summary-card"><img src="${eloImage(tier)}" onerror="this.onerror=null;this.src='/ranks/unranked.png'" alt="${ELO_NAMES[tier] || tier}" /><div><strong>${ELO_NAMES[tier] || tier} ${valores.division}</strong><small>${eloWinrate}% WR · ${valores.wins}V / ${valores.partidas - valores.wins}D</small></div></div>`;
          })
          .join("");

        container.innerHTML = `<div class="history-summary"><div class="history-total"><span>WR TOTAL</span><strong>${winrate}%</strong><small>${wins} victorias · ${losses} derrotas · ${partidas.length} partidas</small></div><div class="elo-summary-list">${eloSummary}</div></div><div class="history-match-list"></div>`;
        const list = container.querySelector(".history-match-list");

        partidas.forEach((partida, index) => {
          const items = (partida.objetos || [])
            .map(
              (item) =>
                `<img src="https://ddragon.leagueoflegends.com/cdn/14.15.1/img/item/${item}.png" alt="Objeto ${item}" />`,
            )
            .join("");
          const coaching = partida.coaching_disponible
            ? `<button class="history-guide-button" onclick="event.stopPropagation(); verGuiaMatchup('${partida.rol}', '${partida.campeon}', '${partida.enemigo}')">Leer guía</button>`
            : `<span class="history-pending">Guía pendiente</span>`;
          const row = document.createElement("article");
          row.className = `history-match ${partida.victoria ? "win" : "loss"}`;
          row.id = `history-match-${index}`;
          row.innerHTML = `<button class="history-match-toggle" onclick="toggleHistoryMatch(${index})"><span class="history-champion"><img src="https://ddragon.leagueoflegends.com/cdn/14.15.1/img/champion/${championKey(partida.campeon)}.png" onerror="this.style.visibility='hidden'" alt="${partida.campeon}" /><strong>${partida.campeon}</strong></span><span class="history-versus">vs</span><span class="history-enemy"><img src="https://ddragon.leagueoflegends.com/cdn/14.15.1/img/champion/${championKey(partida.enemigo)}.png" onerror="this.style.visibility='hidden'" alt="${partida.enemigo}" /><strong>${partida.enemigo}</strong></span><span class="history-result">${partida.victoria ? "VICTORIA" : "DERROTA"}<small>${partida.kills}/${partida.deaths}/${partida.assists}</small></span><span class="history-chevron">⌄</span></button><div id="history-details-${index}" class="history-match-details hidden"><div class="history-detail-grid"><span>Rol<strong>${partida.rol}</strong></span><span>Modo<strong>${partida.modo || "Clásica"}</strong></span><span>Duración<strong>${partida.duracion || "-"}</strong></span><span>Fecha<strong>${formatMatchDate(partida.fecha)}</strong></span><span>Nivel<strong>${partida.nivel || "-"}</strong></span><span>CS<strong>${partida.cs || 0}</strong></span><span>Visión<strong>${partida.vision_score || 0}</strong></span><span>Wards<strong>${partida.wards_placed || 0} / ${partida.wards_killed || 0}</strong></span><span>Oro<strong>${(partida.oro || 0).toLocaleString("es-ES")}</strong></span><span>Daño<strong>${(partida.daño_campeones || 0).toLocaleString("es-ES")}</strong></span><span>Parche<strong>${Array.isArray(partida.parche) ? partida.parche.join(".") : "-"}</strong></span><span>Región<strong>${partida.region || "-"}</strong></span></div><div class="history-items"><span>Objetos</span>${items || "<small>Sin objetos registrados</small>"}</div><div class="history-actions">${coaching}</div></div>`;
          list.appendChild(row);
        });
      }

      async function analizarDraft() {
        const ordenElos = [
          "challenger",
          "grandmaster",
          "master",
          "diamond",
          "emerald",
          "platinum",
          "gold",
          "silver",
          "bronze",
          "iron",
          "unranked",
        ];

        const body = {
          top_aliado: document
            .getElementById("top-aliado")
            .value.trim()
            .toLowerCase(),
          top_enemigo: document
            .getElementById("top-enemigo")
            .value.trim()
            .toLowerCase(),
          jungle_aliado: document
            .getElementById("jungle-aliado")
            .value.trim()
            .toLowerCase(),
          jungle_enemigo: document
            .getElementById("jungle-enemigo")
            .value.trim()
            .toLowerCase(),
          mid_aliado: document
            .getElementById("mid-aliado")
            .value.trim()
            .toLowerCase(),
          mid_enemigo: document
            .getElementById("mid-enemigo")
            .value.trim()
            .toLowerCase(),
          adc_aliado: document
            .getElementById("adc-aliado")
            .value.trim()
            .toLowerCase(),
          adc_enemigo: document
            .getElementById("adc-enemigo")
            .value.trim()
            .toLowerCase(),
          support_aliado: document
            .getElementById("support-aliado")
            .value.trim()
            .toLowerCase(),
          support_enemigo: document
            .getElementById("support-enemigo")
            .value.trim()
            .toLowerCase(),
        };

        try {
          const response = await fetch("/api/analizar_draft", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await response.json();

          if (!data || !data.resultados) return;

          data.resultados.forEach((res) => {
            const el = document.getElementById(`res-${res.rol}`);
            if (!el) return;

            const champAliado = body[`${res.rol.toLowerCase()}_aliado`];
            const champEnemigo = body[`${res.rol.toLowerCase()}_enemigo`];
            const guideId = `guide-${res.rol}`;

            const btnGuia = `<button type="button" class="draft-guide-button mt-2 w-full bg-teal-400 text-slate-900 py-1 rounded font-bold hover:bg-teal-300 transition" data-rol="${res.rol}" data-main="${champAliado}" data-enemy="${champEnemigo}">Leer guía</button>`;
            const estadoGuia =
              champAliado && champEnemigo
                ? `<div id="${guideId}" class="guide-status loading text-xs text-slate-400 mt-1">Comprobando guía...</div>`
                : "";
            const guideControls =
              champAliado && champEnemigo
                ? `<div class="draft-guide-stack w-full">${estadoGuia}${btnGuia}</div>`
                : "";

            let eloHtml = "";
            if (res.desglose_elo && res.desglose_elo.length > 0) {
              const desgloseOrdenado = [...res.desglose_elo].sort((a, b) => {
                const idxA = ordenElos.indexOf(a.nombre.toLowerCase());
                const idxB = ordenElos.indexOf(b.nombre.toLowerCase());
                return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
              });

              eloHtml = `<div class="w-full mt-2" style="display: flex; flex-direction: column; gap: 4px; margin-top:5px;">`;
              desgloseOrdenado.forEach((elo) => {
                const iconPath = obtenerLogoRango(elo.nombre);

                eloHtml += `
                  <div style="width: 100%; background-color: rgba(30, 41, 59, 0.6); border: 1px solid rgba(51, 65, 85, 1); border-radius: 6px; padding: 8px 0; display: flex; justify-content: center;">
                    <div style="display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: flex-start !important; gap: 12px; width: 160px;">
                      <img src="${iconPath}" alt="${elo.nombre}" style="width: 38px; padding-left:10px; height: auto; object-fit: contain; flex-shrink: 0; display: inline-block;">
                      <span class="font-medium whitespace-nowrap ${elo.winrate >= 50 ? "text-green-400" : "text-red-400"}" style="font-size: 13px; line-height: 1; margin: 0;">
                        ${elo.winrate}% (${elo.wins}-${elo.losses})
                      </span>
                    </div>
                  </div>
                `;
              });
              eloHtml += `</div>`;
            }

            if (res.estado === "sin_datos") {
              el.className =
                "w-full md:w-48 text-center py-2 px-3 rounded-lg text-sm font-bold bg-slate-800/50 border border-slate-700 text-slate-500 flex flex-col items-center justify-center";
              el.innerHTML = `<span>Sin datos</span>${guideControls}`;
            } else if (res.estado === "gana") {
              el.className =
                "matchup-result matchup-result-win w-full md:w-48 text-center py-2 px-3 rounded-lg text-sm font-bold flex flex-col items-center justify-center bg-green-900/30 border border-green-700";
              el.innerHTML = `<span class="text-green-400">Gana (${res.winrate}% -> ${res.wins}-${res.losses})</span>${eloHtml}${guideControls}`;
            } else if (res.estado === "pierde") {
              el.className =
                "matchup-result matchup-result-loss w-full md:w-48 text-center py-2 px-3 rounded-lg text-sm font-bold flex flex-col items-center justify-center bg-red-900/30 border border-red-700";
              el.innerHTML = `<span class="text-red-400">Pierde (${res.winrate}% -> ${res.wins}-${res.losses})</span>${eloHtml}${guideControls}`;
            } else {
              el.className =
                "matchup-result matchup-result-neutral w-full md:w-48 text-center py-2 px-3 rounded-lg text-sm font-bold flex flex-col items-center justify-center bg-slate-700/50 border border-slate-500";
              el.innerHTML = `<span class="text-slate-300">Empate (${res.winrate}% -> ${res.wins}-${res.losses})</span>${eloHtml}${guideControls}`;
            }

            if (champAliado && champEnemigo) {
              resolverGuiaDraft(res.rol, champAliado, champEnemigo, guideId);
            }
          });
        } catch (err) {
          console.error("[DRAFT] Error analizando draft:", err);
        }
      }

      function obtenerLogoRango(nombreTier) {
        if (!nombreTier) return "/ranks/unranked.png";
        const tier = nombreTier.trim().toLowerCase();
        const rangosValidos = [
          "iron",
          "bronze",
          "silver",
          "gold",
          "platinum",
          "emerald",
          "diamond",
          "master",
          "grandmaster",
          "challenger",
        ];
        const rangoFinal = rangosValidos.includes(tier) ? tier : "unranked";
        return `/ranks/${rangoFinal}.png`;
      }

      async function resolverGuiaDraft(rol, campeon, enemigo, statusId) {
        const status = document.getElementById(statusId);
        if (!status) return;
        const key = `${rol}|${campeon}|${enemigo}`.toLowerCase();
        if (window.guiasEnResolucion?.has(key)) return;
        window.guiasEnResolucion = window.guiasEnResolucion || new Set();
        window.guiasEnResolucion.add(key);

        const path = `/api/guia_matchup/${encodeURIComponent(rol)}/${encodeURIComponent(campeon)}/${encodeURIComponent(enemigo)}`;
        try {
          let response = await fetch(path);
          if (response.status === 404) {
            status.textContent = "Generando guía con IA...";
            response = await fetch("/api/generate-guide", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                rol,
                champ_main: campeon,
                champ_enemy: enemigo,
              }),
            });
            const result = await response.json();
            if (!response.ok || !result.success)
              throw new Error(result.error || "No se pudo generar");
          }
          if (!response.ok && response.status !== 404)
            throw new Error("No se pudo consultar la guía");
          status.textContent = "Guía lista";
          status.className = "guide-status ready";
        } catch (error) {
          status.textContent = "Guía no disponible";
          status.className = "guide-status error";
          console.error("[GUÍA DRAFT]", error);
        } finally {
          window.guiasEnResolucion.delete(key);
        }
      }

        limpiarMatchups();
        // 1. Array con los prefijos de los inputs
        const roles = ["top", "jungle", "mid", "adc", "support"];

        // 2. Limpiar todos los inputs de texto
        roles.forEach((rol) => {
          const aliado = document.getElementById(`${rol}-aliado`);
          const enemigo = document.getElementById(`${rol}-enemigo`);
          aliado.value = "";
          enemigo.value = "";
          updateChampionPortrait(aliado);
          updateChampionPortrait(enemigo);
        });

        // 3. Array con los sufijos de los resultados (en mayúsculas según tu HTML)
        const rolesMayus = ["TOP", "JUNGLE", "MID", "ADC", "SUPPORT"];

        // 4. Restaurar los recuadros de resultados al estado por defecto "Sin datos"
        rolesMayus.forEach((rol) => {
          const resDiv = document.getElementById(`res-${rol}`);
          if (resDiv) {
            resDiv.innerText = "Sin datos";
            // Restauramos las clases de Tailwind originales (grises)
            resDiv.className =
              "w-full md:w-48 text-center py-1.5 px-3 rounded text-sm font-bold bg-gray-800 border border-gray-600 text-gray-400 flex items-center justify-center";
          }
        });
      }

      function closeModal() {
        const backdrop = document.getElementById("modal-backdrop");
        backdrop.style.display = "none";
        backdrop.classList.add("hidden");
      }

      function extraerDatos(matchup) {
        if (!matchup) return null;
        return {
          name: matchup.campeon,
          w: matchup.wins,
          l: matchup.losses,
        };
      }

      async function ejecutarPreload() {
        const btn = document.getElementById("btnPreload");
        const statusEl = document.getElementById("statusPreload");

        btn.disabled = true;
        btn.classList.add("opacity-50", "cursor-not-allowed");
        statusEl.classList.remove("hidden");
        statusEl.textContent = "Iniciando proceso...";

        try {
          const res = await fetch("/api/preload", { method: "POST" });
          const data = await res.json();

          const timer = setInterval(async () => {
            try {
              const sRes = await fetch("/api/preload/status");
              const sData = await sRes.json();
              statusEl.textContent = sData.message;

              if (sData.status === "completed" || sData.status === "error") {
                clearInterval(timer);
                btn.disabled = false;
                btn.classList.remove("opacity-50", "cursor-not-allowed");

                if (sData.status === "completed") {
                  statusEl.classList.replace(
                    "text-yellow-400",
                    "text-green-400",
                  );
                } else {
                  statusEl.classList.replace("text-yellow-400", "text-red-400");
                }
              }
            } catch (err) {
              console.error("[PRELOAD] Error en polling:", err);
            }
          }, 2000);
        } catch (err) {
          console.error("[PRELOAD] Error crítico al iniciar:", err);

          btn.disabled = false;
          btn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      }

      async function detenerPreload() {
        const btnStop = document.getElementById("btnStopPreload");
        btnStop.disabled = true;
        btnStop.innerText = "Deteniendo...";
        btnStop.classList.add("opacity-50", "cursor-not-allowed");

        try {
          await fetch("/api/preload/stop", { method: "POST" });
        } catch (error) {
          console.error("Error pidiendo detener la precarga:", error);
        }
      }

      async function comprobarEstadoPreload() {
        try {
          const response = await fetch("/api/preload/status");
          const data = await response.json();

          const btnPreload = document.getElementById("btnPreload");
          const btnStop = document.getElementById("btnStopPreload");
          const statusSpan = document.getElementById("statusPreload");

          statusSpan.innerText = data.message;

          if (data.status === "running") {
            btnPreload.disabled = true;
            btnPreload.classList.add("opacity-50", "cursor-not-allowed");

            btnStop.classList.remove("hidden");
            btnStop.disabled = false;
            btnStop.innerText = "Detener";
            btnStop.classList.remove("opacity-50", "cursor-not-allowed");

            setTimeout(comprobarEstadoPreload, 2000);
          } else if (data.status === "stopping") {
            btnStop.classList.remove("hidden");
            btnStop.disabled = true;
            btnStop.innerText = "Guardando...";
            btnStop.classList.add("opacity-50", "cursor-not-allowed");

            setTimeout(comprobarEstadoPreload, 2000);
          } else {
            btnPreload.disabled = false;
            btnPreload.classList.remove("opacity-50", "cursor-not-allowed");
            btnStop.classList.add("hidden");
          }
        } catch (error) {
          console.error("Error consultando estado:", error);
        }
      }

      document.getElementById("btn-cargar-sin-guia").click();
    </script>
  </body>
</html>
